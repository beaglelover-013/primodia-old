  今日营业状态: 准备营业
  整体概况: 磨坊渡村口的老酒馆，石砌外墙爬满枯藤，屋檐下的铁招牌在融雪风中轻轻晃荡。大厅能坐二十来人，后院有口老水井和三间客房。
  区域:
    大厅:
      状态: 整洁
      状态原因: 清晨刚打扫过
      风格: 乡村木石混搭
      描述: 石板地面，六张橡木桌配长凳，靠墙有壁炉，炉火刚生起来。吧台是整块老榆木，后面墙上挂着几排锡酒杯。
      分配员工: 待定
      设施:
        壁炉:
          状态: 良好
          风格: 石砌乡村风
          描述: 河石垒砌的壁炉，烟道通畅，炉膛里堆着劈好的松木柴。
          价格折合铜币: 0
        吧台:
          状态: 整洁
          风格: 老榆木原色
          描述: 整块老榆木打磨的吧台，台面上有年深日久的杯底印痕，后面是酒桶架和杯架。
          价格折合铜币: 0
    厨房:
      状态: 整洁
      状态原因: 昨晚收拾干净
      风格: 实用乡村厨房
      描述: 石板灶台，铁锅三口，烤炉一座。墙角堆着柴火，窗边挂着干香草和蒜辫。石砌水槽连着后院水井的手压泵。
      分配员工: 待定
      设施:
        铁灶:
          状态: 良好
          风格: 铸铁实用
          描述: 三眼铸铁灶台，带烤炉，烧柴火。灶面有长年油渍沁出的暗色纹路。
          价格折合铜币: 0
        水槽:
          状态: 良好
          风格: 石砌
          描述: 石砌水槽连通后院手压泵，冷水随时可取。
          价格折合铜币: 0
    后院:
      状态: 整洁
      状态原因: 融雪后地面湿漉但干净
      风格: 乡村院落
      描述: 夯土地面，一口老水井带手压泵。院角堆着劈好的柴火垛，另一边是晾衣绳和鸡舍。客房在院子东侧，马厩在西侧。
      分配员工: 待定
      设施:
        水井:
          状态: 良好
          风格: 石砌老井
          描述: 石砌井圈，水质清冽，带黄铜手压泵。井口盖着厚木板防落叶。
          价格折合铜币: 0
        柴火垛:
          状态: 良好
          风格: 实用
          描述: 劈好的松木和橡木柴火，码放整齐，用旧帆布半盖着防雨。
          价格折合铜币: 0
    储物地窖:
      状态: 整洁
